# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# The app is a set of plain ES modules; make sure they are served as JS.
[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Never let a stale index.html pair with fresh modules — that combination has broken
# the page before (an element the new code expects is missing from the cached HTML).
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
